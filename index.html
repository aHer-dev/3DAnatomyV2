<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'wasm-unsafe-eval';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self';
  connect-src 'self';
  media-src 'self' blob:;
  worker-src 'self' blob:;
  object-src 'none';
  base-uri 'self';
  upgrade-insecure-requests">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BlueBody 3D</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
</head>


<body>
  <!-- Container für Renderer -->
  <div id="canvas-container">
    <canvas id="canvas" aria-label="3D Anatomie-Ansicht"></canvas>
  </div>

  <!-- React Overlay — pointer-events: none am Root, Kinder schalten selektiv ein -->
  <div id="ui-root" style="position:fixed;inset:0;pointer-events:none;z-index:20;"></div>

  <!-- Script -->
  <script type="module" src="app.js"></script>
</body>
</html>
